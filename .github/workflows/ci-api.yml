name: CI API

on:
  push:
    paths:
      - apps/api/**
      - .github/workflows/ci-api.yml
  pull_request:
    paths:
      - apps/api/**
      - .github/workflows/ci-api.yml

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23
          cache-dependency-path: apps/api/go.sum
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...
